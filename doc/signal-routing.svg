<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1185" width="1040" height="1185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1040" height="1185" fill="#fbfaf7"/>

  <text x="40" y="42" font-size="23" font-weight="700" fill="#111827">SpaceDub — signal routing</text>
  <text x="40" y="65" font-size="13" fill="#5b6472">DXi → VST3 / AUv2 port. One delay line per channel; the stereo image is made afterwards, by the tap matrix.</text>

  <!-- ================= PANEL A ================= -->
  <rect x="30" y="86" width="980" height="560" rx="10" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="50" y="114" font-size="15" font-weight="700" fill="#111827">A  ·  One delay line</text>
  <text x="240" y="114" font-size="12.5" fill="#6b7280">DelayLine::process() — the processor holds two, mDelayL and mDelayR</text>

  <!-- loop-scale regeneration arcs, above the buffer -->
  <text x="677" y="150" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">× Loop Scale — tap-to-tap regeneration, when Taps Feedback is on</text>
  <path d="M541,182 C541,163 404,163 404,182" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M677,182 C677,163 541,163 541,182" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M814,182 C814,163 677,163 677,182" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M950,182 C950,163 814,163 814,182" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- input -->
  <circle cx="78" cy="224" r="17" fill="#eef4fb" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="78" y="229" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">in</text>
  <text x="78" y="262" font-size="11" fill="#6b7280" text-anchor="middle">inL / inR</text>
  <line x1="97" y1="224" x2="134" y2="224" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- write head -->
  <rect x="138" y="204" width="96" height="40" rx="5" fill="#f4f6f8" stroke="#334155"/>
  <text x="186" y="220" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">write head</text>
  <text x="186" y="234" font-size="10.5" fill="#6b7280" text-anchor="middle">line[addPos]</text>
  <line x1="234" y1="224" x2="264" y2="224" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- buffer -->
  <text x="270" y="194" font-size="11.5" fill="#1d4ed8">circular buffer — sampleRate × 8 seconds</text>
  <rect x="268" y="200" width="682" height="48" rx="6" fill="#eef4fb" stroke="#1d4ed8" stroke-width="1.4"/>

  <!-- tap ticks -->
  <g stroke="#1d4ed8" stroke-width="1.6">
    <line x1="404" y1="200" x2="404" y2="248"/><line x1="541" y1="200" x2="541" y2="248"/>
    <line x1="677" y1="200" x2="677" y2="248"/><line x1="814" y1="200" x2="814" y2="248"/>
    <line x1="950" y1="200" x2="950" y2="248"/>
  </g>
  <g stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="404" y1="248" x2="404" y2="286"/><line x1="541" y1="248" x2="541" y2="286"/>
    <line x1="677" y1="248" x2="677" y2="286"/><line x1="814" y1="248" x2="814" y2="286"/>
    <line x1="950" y1="248" x2="950" y2="502"/>
  </g>
  <g font-size="11" fill="#334155" text-anchor="middle" font-weight="600">
    <text x="404" y="300">tap 1</text><text x="541" y="300">tap 2</text>
    <text x="677" y="300">tap 3</text><text x="814" y="300">tap 4</text><text x="950" y="300">tap 5</text>
  </g>
  <g font-size="10" fill="#8a94a0" text-anchor="middle">
    <text x="404" y="313">−1×d</text><text x="541" y="313">−2×d</text>
    <text x="677" y="313">−3×d</text><text x="814" y="313">−4×d</text><text x="950" y="313">−5×d</text>
  </g>
  <text x="290" y="268" font-size="10.5" fill="#8a94a0">increasing delay →</text>

  <!-- taps 1-4 bracket -->
  <path d="M404,320 L404,334 L814,334 L814,320" fill="none" stroke="#334155" stroke-width="1.3"/>
  <line x1="609" y1="334" x2="609" y2="352" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="539" y="352" width="140" height="32" rx="5" fill="#f4f6f8" stroke="#334155"/>
  <text x="609" y="372" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">× Taps Gain</text>
  <line x1="609" y1="384" x2="609" y2="406" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="609" y="420" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">to stereo matrix — taps 1–4</text>
  <text x="609" y="434" font-size="10.5" fill="#8a94a0" text-anchor="middle">muted unless Taps Out is on</text>

  <text x="938" y="400" font-size="10.5" fill="#8a94a0" text-anchor="end">last tap</text>

  <!-- filter path -->
  <rect x="210" y="466" width="656" height="56" rx="6" fill="#fdf6ec" stroke="#e0c9a6"/>
  <text x="222" y="484" font-size="11" font-weight="700" fill="#b45309">FILTER PATH — tap 5 only, when Filter L / Filter R is on</text>

  <path d="M950,502 L862,502" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <g font-size="11" text-anchor="middle">
    <rect x="742" y="490" width="112" height="24" rx="4" fill="#ffffff" stroke="#334155"/>
    <text x="798" y="506" fill="#111827">+ dither</text>
    <line x1="742" y1="502" x2="716" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="562" y="490" width="154" height="24" rx="4" fill="#ffffff" stroke="#334155"/>
    <text x="639" y="506" fill="#111827">Moog ladder, 4 poles</text>
    <line x1="562" y1="502" x2="536" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="404" y="490" width="132" height="24" rx="4" fill="#ffffff" stroke="#334155"/>
    <text x="470" y="506" fill="#111827">× Filter Gain</text>
    <line x1="404" y1="502" x2="378" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="238" y="490" width="140" height="24" rx="4" fill="#ffffff" stroke="#334155"/>
    <text x="308" y="506" fill="#111827">× Feedback Out</text>
    <line x1="238" y1="502" x2="200" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
  <text x="639" y="534" font-size="10" fill="#8a94a0" text-anchor="middle">Cutoff · Resonance</text>
  <text x="194" y="498" font-size="11" font-weight="600" fill="#334155" text-anchor="end">to matrix,</text>
  <text x="194" y="511" font-size="11" font-weight="600" fill="#334155" text-anchor="end">replacing tap 5</text>

  <text x="50" y="628" font-size="10.5" fill="#6b7280">Filter off: tap 5 is an ordinary tap — buffer × Taps Gain, like the other four. Note the filtered tap leaves through <tspan font-weight="700">Feedback Out</tspan>, not Taps Gain.</text>

  <!-- main feedback: tapped after Filter Gain, before Feedback Out -->
  <path d="M470,514 L470,590 L48,590 L48,186 L186,186 L186,200" fill="none" stroke="#b45309" stroke-width="1.7" marker-end="url(#ar)"/>
  <rect x="240" y="577" width="120" height="26" rx="5" fill="#fdf6ec" stroke="#b45309"/>
  <text x="300" y="594" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">× Feedback</text>
  <text x="500" y="584" font-size="10.5" fill="#b45309">main feedback, when Main Feedback is on</text>
  <text x="500" y="600" font-size="10.5" fill="#c98a4b">(filter off: the raw last tap is fed back instead)</text>

  <!-- ================= PANEL B ================= -->
  <rect x="30" y="675" width="980" height="460" rx="10" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="50" y="703" font-size="15" font-weight="700" fill="#111827">B  ·  Stereo tap matrix</text>
  <text x="240" y="703" font-size="12.5" fill="#6b7280">SpaceDubProcessor::processAudio() — carried over from the DXi unchanged</text>
  <text x="50" y="723" font-size="11.5" fill="#6b7280">Tap 5 sits hard in its own channel; each earlier tap walks 10 % further toward the centre.</text>

  <rect x="62" y="749" width="128" height="42" rx="5" fill="#eef4fb" stroke="#1d4ed8"/>
  <text x="126" y="767" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">tapsL[1..5]</text>
  <text x="126" y="781" font-size="10" fill="#6b7280" text-anchor="middle">from delay line L</text>

  <rect x="850" y="749" width="128" height="42" rx="5" fill="#eef4fb" stroke="#1d4ed8"/>
  <text x="914" y="767" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">tapsR[1..5]</text>
  <text x="914" y="781" font-size="10" fill="#6b7280" text-anchor="middle">from delay line R</text>

  <path d="M190,770 L330,770" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M850,770 L710,770" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- weight table -->
  <rect x="334" y="745" width="372" height="176" rx="6" fill="#f7f9fb" stroke="#c7ced6"/>
  <g font-size="11.5" fill="#334155" text-anchor="middle">
    <text x="392" y="767" font-weight="700">tap</text>
    <text x="520" y="767" font-weight="700">own channel</text>
    <text x="648" y="767" font-weight="700">other channel</text>
  </g>
  <line x1="346" y1="775" x2="694" y2="775" stroke="#c7ced6"/>
  <g font-size="12" text-anchor="middle" fill="#111827">
    <text x="392" y="797">5</text><text x="520" y="797" font-weight="600">100 %</text><text x="648" y="797" fill="#8a94a0">0 %</text>
    <text x="392" y="821">4</text><text x="520" y="821">90 %</text><text x="648" y="821">10 %</text>
    <text x="392" y="845">3</text><text x="520" y="845">80 %</text><text x="648" y="845">20 %</text>
    <text x="392" y="869">2</text><text x="520" y="869">70 %</text><text x="648" y="869">30 %</text>
    <text x="392" y="893">1</text><text x="520" y="893">60 %</text><text x="648" y="893">40 %</text>
  </g>
  <text x="520" y="913" font-size="10" fill="#8a94a0" text-anchor="middle">nScale = 1 − (5 − tap) / 10</text>

  <!-- summing -->
  <path d="M420,921 L420,971 L266,971 L266,995" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M620,921 L620,971 L774,971 L774,995" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <circle cx="266" cy="1015" r="20" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="266" y="1022" font-size="17" fill="#1d4ed8" text-anchor="middle">+</text>
  <circle cx="774" cy="1015" r="20" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="774" y="1022" font-size="17" fill="#1d4ed8" text-anchor="middle">+</text>

  <!-- dry paths -->
  <path d="M126,791 L126,1015 L244,1015" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <path d="M914,791 L914,1015 L796,1015" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="136" y="1003" font-size="10.5" fill="#64748b">dry — Straight Thru</text>
  <text x="904" y="1003" font-size="10.5" fill="#64748b" text-anchor="end">dry — Straight Thru</text>

  <line x1="266" y1="1035" x2="266" y2="1063" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="774" y1="1035" x2="774" y2="1063" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="266" y="1081" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">out L</text>
  <text x="774" y="1081" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">out R</text>

  <text x="520" y="1081" font-size="10.5" fill="#8a94a0" text-anchor="middle">Enabled off, or Bypass on,</text>
  <text x="520" y="1095" font-size="10.5" fill="#8a94a0" text-anchor="middle">passes the input straight through.</text>

  <text x="40" y="1165" font-size="10.5" fill="#8a94a0">d = Delay, quantised to whole steps of the sync grid when Sync Rate ≠ Off. Grid = samplesPer32For(divisions, tempo, sampleRate); the host's tempo wins when it supplies one.</text>
</svg>
